name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q report.py extractor.py widget.py
  extractor:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init ttd-capa
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore NuGet packages
        working-directory: ttd-capa/ttd
        run: nuget restore packages.config -PackagesDirectory packages
      - name: Build extractor
        working-directory: ttd-capa/ttd
        run: msbuild ttdcapa-extract.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Smoke test
        working-directory: ttd-capa/ttd/bin/x64/Release
        run: ./ttdcapa-extract.exe --dump-sig CreateFileW
      - uses: actions/upload-artifact@v4
        with:
          name: ttdcapa-extract-x64
          path: |
            ttd-capa/ttd/bin/x64/Release/ttdcapa-extract.exe
            ttd-capa/ttd/data/win32-index.bin
          if-no-files-found: error
